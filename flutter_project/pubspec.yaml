name: sports_academy
description: منظومة أكاديمية الرياضات الاحترافية
publish_to: 'none'
version: 5.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.1
  
  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  
  # Database
  cloud_firestore: ^4.14.0
  supabase_flutter: ^2.3.4
  
  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  
  # Charts
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41
  
  # Image & Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^1.2.1
  
  # Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  
  # PDF & Export
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  uuid: ^4.3.3
  
  # Animations
  flutter_animate: ^4.3.0
  animations: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
